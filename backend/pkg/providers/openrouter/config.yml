# OpenRouter agent configuration.
#
# OpenRouter is an OpenAI-compatible gateway. Models are fully-qualified as
# "<provider>/<model>" to avoid ambiguous routing.
# Defaults intentionally use currently free OpenRouter models that advertise
# tool calling support. Free model availability can change; lightweight bootstrap
# calls use openrouter/free so OpenRouter can route around per-model throttling.

simple:
  model: openrouter/free
  temperature: 0.5
  top_p: 0.8
  n: 1
  max_tokens: 8192
  price:
    input: 0
    output: 0

simple_json:
  model: openrouter/free
  temperature: 0.3
  top_p: 0.8
  n: 1
  max_tokens: 4096
  json: true
  price:
    input: 0
    output: 0

